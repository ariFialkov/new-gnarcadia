<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Blob Royale</title>
<style>html,body{margin:0;height:100%;background:#06281f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}
#cash{pointer-events:auto;font:inherit;font-weight:900;border:0;border-radius:999px;padding:10px 18px;background:#ffe14d;color:#06281f;cursor:pointer;box-shadow:0 6px 18px #0006}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:clamp(20px,5vw,36px);pointer-events:none;text-shadow:0 2px 12px #000}
#msg small{display:block;font-size:.5em;font-weight:600;opacity:.85}</style></head>
<body><canvas id="c"></canvas>
<div id="hud"><span id="bank">bank $0.00 · bounty $0.00</span><button id="cash">Cash out</button></div>
<div id="msg">Connecting…</div>
<script src="/sdk/gnarcadia.iife.js"></script>
<script>
(async () => {
  const g = await Gnarcadia.init();
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), msg = document.getElementById('msg'), bankEl = document.getElementById('bank');
  const fmt = (c) => (c / 100).toLocaleString(undefined, { style: 'currency', currency: g.match.currency });
  let state = null, me = { bank: 0, bounty: g.match.entryCents }, dead = false, out = false;
  const COLORS = ['#ffe14d', '#ff4fa3', '#4ff0ff', '#a78bfa', '#34d399', '#fb923c'];
  g.ready();
  const rt = await g.realtime();
  rt.on('state', (s) => { state = s; });
  rt.on('bounty', (pid, bounty, bank) => { if (pid === rt.playerId) { me = { bank, bounty }; } });
  rt.on('event', (name, d) => { if (name === 'gn:eliminated' && d.playerId === rt.playerId) { dead = true; msg.innerHTML = `Eaten!<small>You keep your banked ${fmt(d.cashOutCents ?? 0)}. Bounty lost.</small>`; setTimeout(() => g.exit(), 3500); } });
  rt.on('private', (name, d) => { if (name === 'gn:cashout_settled') { msg.innerHTML = `Cashed out ${fmt(d.cents)}<small>Back to the arcade…</small>`; setTimeout(() => g.exit(), 2500); } });
  rt.on('error', (code, m) => { if (!dead) msg.textContent = code + ': ' + m; });
  rt.on('disconnected', () => { if (!dead && !out) msg.textContent = 'Reconnecting…'; });
  document.getElementById('cash').onclick = () => { if (dead || out) return; out = true; rt.leave(); msg.innerHTML = `Cashing out…`; if (g.match.practice) setTimeout(() => g.exit(), 1200); };
  let pointer = null; addEventListener('pointerdown', (e) => pointer = e); addEventListener('pointermove', (e) => pointer = e); addEventListener('pointerup', () => pointer = null);
  setInterval(() => { if (!pointer || !state || dead || out) return; const b = state.blobs[rt.playerId]; if (!b) return; const cam = camera(); rt.send({ dx: (pointer.clientX - cam.ox) / cam.k - b.x, dy: (pointer.clientY - cam.oy) / cam.k - b.y }); }, 50);
  function camera() { const b = state?.blobs?.[rt.playerId]; const k = Math.min(innerWidth, innerHeight) / 220; return { k, ox: innerWidth / 2 - (b ? b.x : 200) * k, oy: innerHeight / 2 - (b ? b.y : 200) * k }; }
  function draw() {
    requestAnimationFrame(draw);
    const dpr = devicePixelRatio || 1; if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#06281f'; ctx.fillRect(0, 0, innerWidth, innerHeight);
    if (!state) return;
    const { k, ox, oy } = camera(); ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
    ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1 / k; for (let x = 0; x <= state.w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, state.h); ctx.stroke(); } for (let y = 0; y <= state.h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(state.w, y); ctx.stroke(); }
    for (const f of state.food) { ctx.fillStyle = COLORS[f.c]; ctx.beginPath(); ctx.arc(f.x, f.y, 1.6, 0, 7); ctx.fill(); }
    const blobs = Object.entries(state.blobs).sort((a, b) => a[1].r - b[1].r);
    for (const [pid, b] of blobs) {
      ctx.fillStyle = pid === rt.playerId ? '#ffe14d' : b.skin.includes('lava') ? '#ff6a00' : COLORS[(b.name.length + pid.charCodeAt(2)) % COLORS.length];
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#000a'; ctx.font = `bold ${Math.max(3, b.r / 2.2)}px system-ui`; ctx.textAlign = 'center'; ctx.fillText(b.name, b.x, b.y + b.r / 6);
    }
    bankEl.textContent = `bank ${fmt(me.bank)} · bounty ${fmt(me.bounty)} · ${blobs.length} in arena`;
    if (!dead && !out) msg.textContent = rt.phase === 'waiting' ? 'Waiting…' : '';
  }
  draw();
})();
</script></body></html>
