name: CI
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 run build
      - run: pnpm -r --workspace-concurrency=1 run test
      - name: Validate example games
        run: for g in examples/games/*; do node packages/cli/dist/index.js validate "$g"; done
